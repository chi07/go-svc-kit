version: "2"
run:
  tests: true
  allow-parallel-runners: true
output:
  formats:
    text:
      path: stdout
linters:
  enable:
    - bodyclose
    - copyloopvar
    - dogsled
    - dupl
    - exhaustive
    - goconst
    - gocritic
    - misspell
    - nakedret
    - prealloc
    - revive
    - sqlclosecheck
    - staticcheck
    - unconvert
    - unparam
    - whitespace
  settings:
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
        - style
      disabled-checks:
        - hugeParam
    misspell:
      locale: US
    revive:
      rules:
        - name: indent-error-flow
        - name: errorf
        - name: error-naming
        - name: exported
        - name: if-return
  exclusions:
    generated: lax
    rules:
      - path: (.+)\.go$
        text: should have comment or be unexported
      - path: _test\.go$
        linters:
          - goconst
          - bodyclose
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    gofumpt:
      extra:
        group-params: true
    goimports:
      local-prefixes:
        - github.com/chi07/go-svc-kit/v2
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
